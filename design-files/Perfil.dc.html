<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Meu perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@700&display=swap">
<style>
body{margin:0}
a{color:#2E43C8}a:hover{color:#2436A8}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; background: #F5F6FA; font-family: Inter, sans-serif; color: #151826">
  <div style="flex: 1 1 248px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E4E6EE">
    <dc-import name="Sidebar" perfil="aluno" ativo="perfil" hint-size="100%,860px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; box-sizing: border-box">
    <div style="max-width: 760px; display: flex; flex-direction: column; gap: 24px">
      <header style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 40px; font-weight: 700">Meu perfil</h1>
        <span style="font-size: 14px; color: #5A6072">Opcional no MVP: só entra se o fluxo principal estiver pronto.</span>
      </header>

      <section style="background: #FFFFFF; border: 1px solid #E4E6EE; border-radius: 16px; overflow: hidden">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; padding: 24px; border-bottom: 1px solid #E4E6EE">
          <span style="width: 72px; height: 72px; border-radius: 999px; background: #DDE2FA; color: #1C2A8C; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; flex: 0 0 72px">AS</span>
          <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 240px">
            <span style="font-size: 20px; font-weight: 600">Ana Souza</span>
            <span style="display: inline-flex; align-self: flex-start; align-items: center; height: 24px; padding: 0 10px; border-radius: 6px; background: #DDE2FA; color: #1C2A8C; font-size: 11px; font-weight: 700; letter-spacing: 0.08em">ALUNO</span>
          </div>
          <span style="font-size: 13px; color: #5A6072; max-width: 220px">Foto de perfil chega numa próxima versão.</span>
        </div>
        <form style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 600">Dados pessoais</h2>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pf-nome" style="font-size: 14px; font-weight: 600">Nome</label>
            <input id="pf-nome" value="Ana Souza" autocomplete="name" style="height: 44px; padding: 0 14px; border: 1px solid #C9CDDA; border-radius: 6px; font: 15px Inter, sans-serif; color: #151826; box-sizing: border-box">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pf-email" style="font-size: 14px; font-weight: 600">E-mail</label>
            <input id="pf-email" type="email" value="ana.souza@aluno.edu.br" autocomplete="email" style="height: 44px; padding: 0 14px; border: 1px solid #C9CDDA; border-radius: 6px; font: 15px Inter, sans-serif; color: #151826; box-sizing: border-box">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 14px; font-weight: 600">Perfil de acesso</span>
            <span style="font-size: 14px; color: #5A6072">Aluno · o perfil não pode ser alterado por aqui.</span>
          </div>
          <div style="display: flex; justify-content: flex-end"><button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #2E43C8; color: #FFFFFF; font: 600 15px Inter, sans-serif">Salvar dados</button></div>
        </form>
      </section>

      <section style="background: #FFFFFF; border: 1px solid #E4E6EE; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600">Alterar senha</h2>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="pf-atual" style="font-size: 14px; font-weight: 600">Senha atual</label>
          <input id="pf-atual" type="password" autocomplete="current-password" style="height: 44px; padding: 0 14px; border: 1px solid #C9CDDA; border-radius: 6px; font: 15px Inter, sans-serif; box-sizing: border-box">
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pf-nova" style="font-size: 14px; font-weight: 600">Nova senha</label>
            <input id="pf-nova" type="password" autocomplete="new-password" placeholder="Mín. 8 caracteres" style="height: 44px; padding: 0 14px; border: 1px solid #C9CDDA; border-radius: 6px; font: 15px Inter, sans-serif; box-sizing: border-box">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pf-nova2" style="font-size: 14px; font-weight: 600">Confirmar nova senha</label>
            <input id="pf-nova2" type="password" autocomplete="new-password" aria-invalid="true" aria-describedby="pf-nova2-erro" style="height: 44px; padding: 0 14px; border: 1px solid #C0322A; border-radius: 6px; font: 15px Inter, sans-serif; box-sizing: border-box; box-shadow: 0 0 0 3px #FCE9E7">
            <span id="pf-nova2-erro" style="font-size: 13px; color: #C0322A">As senhas não são iguais.</span>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end"><button type="button" style="height: 44px; padding: 0 18px; border: 1px solid #C9CDDA; border-radius: 10px; background: #FFFFFF; color: #151826; font: 600 15px Inter, sans-serif">Alterar senha</button></div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
