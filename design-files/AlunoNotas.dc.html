<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Notas e média do aluno</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@700&display=swap">
<style>
body{margin:0}
a{color:#2E43C8}a:hover{color:#2436A8}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; background: #F5F6FA; font-family: Inter, sans-serif; color: #151826">
  <div style="flex: 1 1 248px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #E4E6EE">
    <dc-import name="Sidebar" perfil="aluno" ativo="notas" hint-size="100%,860px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; box-sizing: border-box">
    <div style="max-width: 1200px; display: flex; flex-direction: column; gap: 24px">
      <header style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #5A6072">Semestre 2026.2</span>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 40px; font-weight: 700">Notas e média</h1>
      </header>

      <div role="tablist" aria-label="Disciplinas" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ abas }}" as="t" hint-placeholder-count="4">
          <button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: {{ t.borda }}; background: {{ t.bg }}; color: {{ t.cor }}; font: 600 14px Inter, sans-serif">{{ t.nome }}</button>
        </sc-for>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
        <section style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E6EE; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h2 style="margin: 0; font-size: 18px; font-weight: 600">{{ d.nome }}</h2>
            <span style="font-size: 14px; color: #5A6072">{{ d.prof }}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 20px">
            <div role="img" aria-label="Média {{ d.media }} de 10" style="width: 112px; height: 112px; border-radius: 999px; background: conic-gradient({{ d.barra }} {{ d.graus }}, #F0F1F5 0); display: flex; align-items: center; justify-content: center; flex: 0 0 112px">
              <span style="width: 88px; height: 88px; border-radius: 999px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">{{ d.media }}</span><span style="font-size: 11px; color: #5A6072">média</span></span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="display: inline-flex; align-self: flex-start; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; background: {{ d.bg }}; color: {{ d.cor }}; font-size: 13px; font-weight: 600">{{ d.sit }}</span>
              <span style="font-size: 14px; line-height: 1.5; color: #5A6072">{{ d.msg }}</span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #F0F1F5; font-size: 13px; color: #5A6072">
            <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #1C7A4A"></span>Aprovado: média ≥ 7,0</span>
            <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #F2A93B"></span>Recuperação: 5,0 a 6,9</span>
            <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #C0322A"></span>Reprovado: abaixo de 5,0</span>
          </div>
        </section>

        <section style="flex: 2 1 480px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E6EE; border-radius: 16px; overflow: hidden">
          <div style="padding: 20px 24px; border-bottom: 1px solid #E4E6EE; display: flex; justify-content: space-between; align-items: center; gap: 12px"><h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Notas por atividade</h2><span style="font-size: 13px; color: #5A6072">linha tracejada = 7,0</span></div>
          <sc-for list="{{ d.notas }}" as="n" hint-placeholder-count="5">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid #F0F1F5">
              <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 200px; min-width: 0"><span style="font-size: 15px; font-weight: 600">{{ n.titulo }}</span><span style="font-size: 13px; color: #5A6072">{{ n.data }}</span></div>
              <div aria-hidden="true" style="position: relative; flex: 1 1 180px; height: 10px; border-radius: 999px; background: #F0F1F5">
                <span style="position: absolute; left: 0; top: 0; height: 10px; border-radius: 999px; width: {{ n.pct }}; background: {{ n.barra }}"></span>
                <span style="position: absolute; left: 70%; top: -4px; height: 18px; border-left: 2px dashed #5A6072"></span>
              </div>
              <span style="width: 96px; text-align: right; font-family: 'Space Grotesk', sans-serif; font-size: {{ n.tam }}; font-weight: 700; color: {{ n.corTxt }}">{{ n.nota }}</span>
            </div>
          </sc-for>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const S = {
      ap: { sit: 'Aprovado', bg: '#E6F4EC', cor: '#1C7A4A', barra: '#1C7A4A' },
      rec: { sit: 'Recuperação', bg: '#FDF3E1', cor: '#8A5300', barra: '#F2A93B' },
      rep: { sit: 'Reprovado', bg: '#FCE9E7', cor: '#C0322A', barra: '#C0322A' }
    };
    const nota = (titulo, data, v) => {
      if (v === null) return { titulo, data, nota: 'Aguardando', pct: '0%', barra: '#F0F1F5', tam: '14px', corTxt: '#5A6072' };
      const s = v >= 7 ? S.ap : (v >= 5 ? S.rec : S.rep);
      return { titulo, data, nota: v.toFixed(1).replace('.', ','), pct: (v * 10) + '%', barra: s.barra, tam: '20px', corTxt: '#151826' };
    };
    const lista = [
      { nome: 'Banco de Dados', prof: 'Profa. Marina Costa', media: 6.2, msg: 'Faltam 2 atividades. Uma nota 8,0 na Lista 3 já leva sua média a 6,6.', notas: [
        nota('Lista 1 — Modelo ER', 'Entregue em 18 set', 7.0), nota('Prova 1', 'Realizada em 09 out', 5.5), nota('Lista 2 — Normalização', 'Entregue em 30 out', 6.0), nota('Lista 3 — Consultas SQL', 'Entrega até 28 nov', null), nota('Projeto final', 'Entrega até 12 dez', null) ] },
      { nome: 'Desenvolvimento Web', prof: 'Prof. Rafael Dias', media: 8.4, msg: 'Você está acima da média de aprovação. Continue assim.', notas: [
        nota('Landing page em React', 'Entregue em 22 set', 9.0), nota('Prova 1', 'Realizada em 16 out', 7.6), nota('CRUD com NestJS', 'Entregue em 06 nov', 8.6), nota('Trabalho prático: API REST', 'Entrega até 02 dez', null) ] },
      { nome: 'Engenharia de Software', prof: 'Profa. Marina Costa', media: 7.8, msg: 'Aprovada até aqui. Ainda há 2 atividades no semestre.', notas: [
        nota('Documento de requisitos', 'Entregue em 15 set', 8.0), nota('Prova 1', 'Realizada em 08 out', 7.0), nota('Plano de testes', 'Entregue em 27 out', 8.2), nota('Sprint review', 'Entregue em 10 nov', 8.0), nota('Diagrama de casos de uso', 'Entrega até 05 dez', null) ] },
      { nome: 'Algoritmos e Estruturas de Dados', prof: 'Prof. Paulo Reis', media: 7.2, msg: 'Aprovada por pouco: atenção à Prova 2.', notas: [
        nota('Lista de recursão', 'Entregue em 12 set', 8.0), nota('Prova 1', 'Realizada em 14 out', 6.0), nota('Árvores binárias', 'Entregue em 04 nov', 7.6), nota('Prova 2', 'Agendada para 10 dez', null) ] }
    ];
    const i = this.state.sel;
    const raw = lista[i];
    const s = raw.media >= 7 ? S.ap : (raw.media >= 5 ? S.rec : S.rep);
    const d = { ...raw, ...s, media: raw.media.toFixed(1).replace('.', ','), graus: Math.round(raw.media * 36) + 'deg' };
    return {
      d: d,
      abas: lista.map((x, k) => ({
        nome: x.nome,
        sel: k === i ? 'true' : 'false',
        bg: k === i ? '#151826' : '#FFFFFF',
        cor: k === i ? '#FFFFFF' : '#151826',
        borda: k === i ? '1px solid #151826' : '1px solid #C9CDDA',
        pick: () => this.setState({ sel: k })
      }))
    };
  }
}
</script>
</body>
</html>
