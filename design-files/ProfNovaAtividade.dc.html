<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nova atividade · modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@700&display=swap">
<style>
body{margin:0}
a{color:#2E43C8}a:hover{color:#2436A8}
</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 1000px; font-family: Inter, sans-serif; color: #151826">
  <div aria-hidden="true">
    <dc-import name="ProfAtividades" hint-size="100%,1000px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(21,24,38,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 96px 24px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="na-titulo" style="width: 100%; max-width: 600px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 24px 64px rgba(21,24,38,0.28); display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 22px 24px; border-bottom: 1px solid #E4E6EE">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h2 id="na-titulo" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Nova atividade</h2>
          <span style="font-size: 14px; color: #5A6072">Banco de Dados · BD-204</span>
        </div>
        <a href="/ProfAtividades.dc.html" aria-label="Fechar" style="width: 40px; height: 40px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #5A6072; text-decoration: none; font-size: 22px">×</a>
      </div>
      <div style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="na-titulo-campo" style="font-size: 14px; font-weight: 600">Título</label>
          <input id="na-titulo-campo" value="Lista 4 — Índices e transações" style="height: 44px; padding: 0 14px; border: 1px solid #C9CDDA; border-radius: 6px; font: 15px Inter, sans-serif; color: #151826; box-sizing: border-box">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="na-desc" style="font-size: 14px; font-weight: 600">Descrição <span style="font-weight: 400; color: #5A6072">(opcional)</span></label>
          <textarea id="na-desc" rows="4" placeholder="Instruções, formato de entrega e critérios" style="padding: 12px 14px; border: 1px solid #C9CDDA; border-radius: 6px; font: 15px Inter, sans-serif; resize: vertical"></textarea>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="na-data" style="font-size: 14px; font-weight: 600">Data limite <span style="font-weight: 400; color: #5A6072">(opcional)</span></label>
            <input id="na-data" type="date" value="2026-11-20" aria-invalid="true" aria-describedby="na-data-erro" style="height: 44px; padding: 0 14px; border: 1px solid #C0322A; border-radius: 6px; font: 15px Inter, sans-serif; color: #151826; box-sizing: border-box; box-shadow: 0 0 0 3px #FCE9E7">
            <span id="na-data-erro" style="font-size: 13px; color: #C0322A">Escolha uma data a partir de hoje.</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="na-disc" style="font-size: 14px; font-weight: 600">Disciplina</label>
            <select id="na-disc" style="height: 44px; padding: 0 12px; border: 1px solid #C9CDDA; border-radius: 6px; font: 15px Inter, sans-serif; background: #FFFFFF"><option>Banco de Dados</option><option>Desenvolvimento Web</option><option>Engenharia de Software</option><option>Algoritmos e Estruturas de Dados</option></select>
          </div>
        </div>
        <div role="note" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: #EEF0FC; color: #1C2A8C">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; flex: 0 0 20px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7h.01"></path></svg>
          <span style="font-size: 14px; line-height: 20px">A atividade fica visível para os alunos matriculados assim que for criada.</span>
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid #E4E6EE">
        <a href="/ProfAtividades.dc.html" style="height: 44px; padding: 0 18px; border: 1px solid #C9CDDA; border-radius: 10px; background: #FFFFFF; font-weight: 600; font-size: 15px; color: #151826; display: inline-flex; align-items: center; text-decoration: none">Cancelar</a>
        <a href="/ProfAtividades.dc.html" style="height: 44px; padding: 0 18px; border-radius: 10px; background: #2E43C8; color: #FFFFFF; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; text-decoration: none">Criar atividade</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
