<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Página de erro AcadFlow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Caveat:wght@700&display=swap">
<style>
body{margin:0}
a{color:#2E43C8}a:hover{color:#2436A8}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #F5F6FA; font-family: Inter, sans-serif; color: #151826">
  <header style="display: flex; align-items: center; gap: 10px; padding: 24px 40px">
    <dc-import name="LogoMark" tamanho="{{ 36 }}" simples="{{ true }}" hint-size="36px,36px"></dc-import>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">AcadFlow</span>
  </header>
  <main style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 40px 24px 96px">
    <div style="max-width: 560px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px">
      <div aria-hidden="true" style="position: relative; width: 220px; height: 150px">
        <svg width="220" height="150" viewBox="0 0 220 150" style="position: absolute; left: 0; top: 0; fill: none; stroke-linecap: round; stroke-linejoin: round">
          <path d="M20 36 C56 22 90 26 110 42 L110 134 C90 118 56 114 20 128 Z" fill="#FFFFFF" stroke="{{ cor }}" stroke-width="4"></path>
          <path d="M110 42 C130 26 164 22 200 36 L200 128 C164 114 130 118 110 134 Z" fill="{{ fundo }}" stroke="{{ cor }}" stroke-width="4"></path>
        </svg>
        <span style="position: absolute; left: 0; right: 0; top: 56px; font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; letter-spacing: 0.02em; color: {{ cor }}">{{ codigo }}</span>
      </div>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6072">{{ rotulo }}</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 36px; line-height: 44px; font-weight: 700">{{ titulo }}</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #5A6072">{{ texto }}</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px">
        <a href="{{ href }}" style="height: 48px; padding: 0 22px; border-radius: 10px; background: #2E43C8; color: #FFFFFF; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; text-decoration: none">{{ cta }}</a>
        <a href="/Login.dc.html" style="height: 48px; padding: 0 22px; border-radius: 10px; border: 1px solid #C9CDDA; background: #FFFFFF; color: #151826; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; text-decoration: none">{{ cta2 }}</a>
      </div>
      <span style="font-size: 12px; color: #5A6072; font-family: ui-monospace, monospace">{{ detalhe }}</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tipo":{"editor":"enum","options":["404","403","500","offline"],"default":"404"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tipo ?? '404';
    const m = {
      '404': { codigo: '404', rotulo: 'Erro 404', titulo: 'Página não encontrada', texto: 'O endereço que você tentou abrir não existe ou foi movido. Confira o link ou volte para o seu painel.', cta: 'Ir para meu painel', href: '/ProfPainel.dc.html', cta2: 'Voltar ao login', detalhe: 'Caminho: /disciplinas/bd-999', cor: '#2E43C8', fundo: '#EEF0FC' },
      '403': { codigo: '403', rotulo: 'Erro 403 · acesso restrito', titulo: 'Esta área é só para professores', texto: 'Seu perfil é ALUNO e não tem permissão para lançar ou editar notas. Se acha que isso é um engano, fale com a coordenação.', cta: 'Ir para meu painel', href: '/AlunoPainel.dc.html', cta2: 'Entrar com outra conta', detalhe: 'Perfil exigido: PROFESSOR · seu perfil: ALUNO', cor: '#8A5300', fundo: '#FDF3E1' },
      '500': { codigo: '500', rotulo: 'Erro 500', titulo: 'Algo deu errado do nosso lado', texto: 'O servidor não conseguiu concluir a solicitação. Nenhum dado foi perdido — tente novamente em alguns instantes.', cta: 'Tentar novamente', href: '/ProfPainel.dc.html', cta2: 'Voltar ao login', detalhe: 'ID da requisição: 7f3a2c91 · informe ao suporte se persistir', cor: '#C0322A', fundo: '#FCE9E7' },
      'offline': { codigo: 'off', rotulo: 'Sem conexão', titulo: 'Você está sem internet', texto: 'Verifique o Wi-Fi ou os dados móveis. Assim que a conexão voltar, recarregamos a página para você.', cta: 'Tentar reconectar', href: '/ProfPainel.dc.html', cta2: 'Voltar ao login', detalhe: 'Última sincronização: hoje, 14:02', cor: '#5A6072', fundo: '#E9EBF2' }
    };
    return m[t] || m['404'];
  }
}
</script>
</body>
</html>
